# ==========================================================================
# nginx — sert le build statique Gatsby (public/) derrière le Caddy de
# vps-infrastructure. Caddy gère TLS et domaines ; ce fichier ne porte que
# les règles propres au site.
# ==========================================================================

# Stratégie de cache recommandée par Gatsby :
# https://www.gatsbyjs.com/docs/how-to/previews-deploys-hosting/caching/
#   - HTML, page-data, sw.js (et tout fichier non hashé) : toujours revalidés ;
#   - /static/ et les chunks webpack hashés (-<20 hex>.js|css) : immuables.
map $uri $cache_control {
    default                         "public, max-age=0, must-revalidate";
    ~^/static/                      "public, max-age=31536000, immutable";
    # Guillemets obligatoires : nginx lirait sinon {20} comme un bloc.
    "~-[0-9a-f]{20}\.(?:js|css)$"   "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Derrière Caddy, les redirections doivent être relatives. Sinon nginx
    # renverrait Location: http://portfolio_prod_web:8080/...
    absolute_redirect off;

    # IP réelle du visiteur dans les logs (Caddy renseigne X-Forwarded-For).
    # Le conteneur n'est joignable que par le réseau Docker.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # Tous les add_header restent au niveau server : une location qui définit
    # ses propres add_header n'hérite plus de ceux-ci.
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Pas de try_files : nginx sert /dir/index.html, redirige /dir vers /dir/
    # en 301 (trailingSlash: 'always' dans gatsby-config.js) et renvoie la
    # page 404 de Gatsby pour le reste.
    error_page 404 /404.html;
    # Les 404 restent dans l'access log ; inutile de les doubler en erreurs
    # (les robots qui scannent le site en génèrent beaucoup).
    log_not_found off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
