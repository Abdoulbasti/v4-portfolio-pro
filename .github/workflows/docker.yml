# Construit l'image de production et la publie sur GHCR.
#
#   push sur main  → :main, :sha-xxxxxxx         (déployé en test)
#   tag vX.Y.Z     → :X.Y.Z, :X.Y, :latest, :sha-… (déployé en prod)
#   pull request   → build sans push : vérifie que `gatsby build` passe sous Linux
#
# Le déploiement reste manuel sur le VPS : make deploy ENV=test|prod

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Les noms d'image doivent être en minuscules.
  IMAGE: ghcr.io/abdoulbasti/v4-portfolio-pro

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `latest` est ajouté automatiquement sur les tags semver.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
